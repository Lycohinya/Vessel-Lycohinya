plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'com.diffplug.spotless' version '8.10.0'
}

group = 'org.maboroshi'
def baseVersion = '2.1.2'

def getGitHash = { ->
    if (System.getenv("GITHUB_SHA") != null) {
        return System.getenv("GITHUB_SHA").take(6)
    }
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short=6'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception ignored) {
        return "beta"
    }
}

version = project.hasProperty('release') && project.property('release') == 'true' ?
          baseVersion : "${baseVersion}-${getGitHash()}"

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/releases/' }
    maven { url = 'https://repo.nexomc.com/releases' }
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven { url = 'https://repo.glaremasters.me/repository/towny/' }
    maven { url = 'https://mvn.lumine.io/repository/maven-public/' }
    maven { url = 'https://repo.codemc.io/repository/maven-public/' }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.1.2.build.+")
    compileOnly("de.exlll:configlib-paper:4.8.1")
    compileOnly("org.incendo:cloud-paper:2.0.0")
    compileOnly("org.incendo:cloud-annotations:2.1.0")
    implementation("org.bstats:bstats-bukkit:3.2.1")
    compileOnly("me.clip:placeholderapi:2.12.3")
    compileOnly("com.nexomc:nexo:1.27.0")
    compileOnly("com.sk89q.worldguard:worldguard-bukkit:7.0.18")
    compileOnly("com.palmergames.bukkit.towny:towny:0.103.1.1")
    compileOnly("io.lumine:Mythic-Dist:5.13.0")
    // No Maven Central release; CodeMC mirrors GriefPrevention's own CI builds. compileOnly only,
    // never shaded — resolved at runtime against whatever GriefPrevention jar the server has installed.
    compileOnly("com.griefprevention:GriefPrevention:16.18.2-SNAPSHOT")

    // compileOnly isn't extended to the test source set by Gradle's Java plugin, so anything the
    // test code loads (even indirectly, like GriefPreventionProtectionAdapter's Log/Bukkit imports)
    // needs to be repeated here explicitly.
    testImplementation("io.papermc.paper:paper-api:26.1.2.build.+")
    testImplementation("com.griefprevention:GriefPrevention:16.18.2-SNAPSHOT")

    testImplementation(platform("org.junit:junit-bom:6.0.3"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
    useJUnitPlatform()
}

tasks.register("printVersion") {
    group = "versioning"
    doLast {
        println("VERSION=${version}")
    }
}

tasks.named('shadowJar') {
    relocate 'org.bstats', 'org.maboroshi.vessel.libs.bstats'
    exclude 'plugin.yml'
    minimize()
    archiveClassifier.set('')
}

build.dependsOn shadowJar
build.dependsOn spotlessApply

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add("-parameters")
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

spotless {
    format 'misc', {
        target '*.gradle', '.gitattributes', '.gitignore'
        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }

    java {
        importOrder()
        removeUnusedImports()
        forbidWildcardImports()
        cleanthat()
        palantirJavaFormat('2.96.0')
        formatAnnotations()
    }
}
